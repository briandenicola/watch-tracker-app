services:
  app:
    image: bjd145/watch-tracker-app:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ForwardedHeaders__TrustedNetworks=${TRUSTED_PROXY_NETWORKS:-}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/watchtracker.db
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env (min 32 chars)}
      - Jwt__Issuer=WatchTracker
      - Jwt__Audience=WatchTracker
      - AllowedOrigins=${ALLOWED_ORIGINS:-*}
      - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
      - VITE_API_BASE_URL=""
    ports:
      - "8080:8080"
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  db-data:
  uploads:
