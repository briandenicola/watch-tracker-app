version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: vue-router
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: /src/api
    schedule:
      interval: weekly
    groups:
      skiasharp:
        patterns:
          - SkiaSharp
          - SkiaSharp.NativeAssets.*

  - package-ecosystem: nuget
    directory: /src/api.tests
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
