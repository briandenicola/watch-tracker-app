version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
      github-actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: vue-router
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/api
    schedule:
      interval: weekly
    groups:
      skiasharp:
        patterns:
          - SkiaSharp
          - SkiaSharp.NativeAssets.*
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/api.tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /src/api
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
