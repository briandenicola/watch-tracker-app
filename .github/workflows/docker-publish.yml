name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: index.docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/watch-tracker-app

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate API
        run: |
          dotnet restore src/api.tests/WatchTracker.Api.Tests.csproj
          set -o pipefail
          for project in src/api/WatchTracker.Api.csproj src/api.tests/WatchTracker.Api.Tests.csproj; do
            dotnet package list --project "$project" --vulnerable --include-transitive --format json --output-version 1 --no-restore | jq -e '[.. | objects | .vulnerabilities? | arrays | .[]? | select((.severity // .Severity // "" | ascii_downcase) as $severity | $severity == "high" or $severity == "critical")] | length == 0'
          done
          dotnet build src/api/WatchTracker.Api.csproj --no-restore --no-incremental
          dotnet test src/api.tests/WatchTracker.Api.Tests.csproj --no-restore

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Validate web
        working-directory: src/web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run test
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
