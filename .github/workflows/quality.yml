name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/api.tests/WatchTracker.Api.Tests.csproj
      - name: Audit NuGet dependencies
        run: |
          set -o pipefail
          for project in src/api/WatchTracker.Api.csproj src/api.tests/WatchTracker.Api.Tests.csproj; do
            dotnet package list --project "$project" --vulnerable --include-transitive --format json --output-version 1 --no-restore | jq -e '[.. | objects | .vulnerabilities? | arrays | .[]? | select((.severity // .Severity // "" | ascii_downcase) as $severity | $severity == "high" or $severity == "critical")] | length == 0'
          done
      - run: dotnet build src/api/WatchTracker.Api.csproj --no-restore --no-incremental
      - run: dotnet test src/api.tests/WatchTracker.Api.Tests.csproj --no-restore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - working-directory: src/web
        run: npm ci
      - name: Audit npm dependencies
        working-directory: src/web
        run: npm audit --audit-level=high
      - working-directory: src/web
        run: npm run lint
      - working-directory: src/web
        run: npm run test
      - working-directory: src/web
        run: npm run build
