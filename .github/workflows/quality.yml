name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/api.tests/WatchTracker.Api.Tests.csproj
      - run: dotnet build src/api/WatchTracker.Api.csproj --no-restore --no-incremental
      - run: dotnet test src/api.tests/WatchTracker.Api.Tests.csproj --no-restore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - working-directory: src/web
        run: npm ci
      - working-directory: src/web
        run: npm run lint
      - working-directory: src/web
        run: npm run test
      - working-directory: src/web
        run: npm run build
